name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON artifacts parse
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('artifacts').rglob('*.json'):
              try: json.loads(p.read_text())
              except Exception as e: bad.append(f"{p}: {e}")
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('all artifact JSON valid')
          PY
      - name: bench-ext unit tests (golden TodoMVC, provenance, corpus ingestion, pass rules)
        run: python3 -m unittest discover -s bench-ext/tests -t bench-ext
      - name: Screenshots present
        run: |
          c1=$(find artifacts/2026-09-10 -name '*.png' | wc -l)
          c2=$(find artifacts/2026-09-11 -name '*.png' | wc -l)
          [ "$c1" -ge 12 ] || { echo "round1 screenshots: $c1"; exit 1; }
          [ "$c2" -ge 10 ] || { echo "round2 screenshots: $c2"; exit 1; }
          echo "screenshots ok: $c1 + $c2"
      - name: No synthetic task fixtures
        run: python3 -m unittest discover -s bench-ext/tests -t bench-ext -p 'test_no_synthetic_fixtures.py'
      - name: Harvested corpus validates and ingests
        run: python3 bench-ext/task_ingest.py --no-session-check
      - name: No secrets in artifacts
        run: |
          if grep -rIn "sk-or-v1-[A-Za-z0-9]\{20,\}" artifacts/; then echo "secret-like token found"; exit 1; fi
          echo "no hardcoded tokens"
      - name: README publishing rule
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path('README.md').read_text()
          lines = text.splitlines()
          tables = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.strip().startswith('|') and i + 1 < len(lines) and re.fullmatch(r'[|:\- ]+', lines[i+1].strip()) and len(line.strip()) > 2:
                  header = [c.strip() for c in line.strip().strip('|').split('|')]
                  j = i + 2
                  rows = 0
                  while j < len(lines) and lines[j].strip().startswith('|'):
                      rows += 1; j += 1
                  tables.append((header, rows))
                  i = j
              else:
                  i += 1
          if not tables:
              print('FAIL: no tables found in README'); sys.exit(1)
          for h, n in tables:
              if len(h) not in (3, 6, 7):
                  print(f'FAIL: table with unexpected column count {len(h)}: {h}'); sys.exit(1)
          # exactly one 7-column master leaderboard with the required header
          expected = ['Harness', 'Repo', 'Round', 'Pass', 'Median time', 'Tokens in/out', 'Cost per run']
          sevens = [h for h, n in tables if len(h) == 7]
          if len(sevens) != 1:
              print(f'FAIL: expected exactly one 7-column master leaderboard, found {len(sevens)}'); sys.exit(1)
          if sevens[0] != expected:
              print(f'FAIL: master leaderboard header {sevens[0]} != required {expected}'); sys.exit(1)
          # no editorial Q&A verdict tables (two-column "Question | Answer")
          for h, n in tables:
              if len(h) == 2:
                  print('FAIL: editorial verdict-style table found (Question/Answer) — not allowed'); sys.exit(1)
          print(f'README publishing rule ok: {len(tables)} tables, one master leaderboard')
          PY
